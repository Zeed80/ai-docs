# E49: the isolated world for live employee evaluation.
#
# A separate Compose project (`-p aiw-eval`) built from the deployed images,
# with its own throwaway Postgres and Redis (tmpfs: nothing survives `down`)
# and its own network. It is not attached to the stack network, so it cannot
# reach production Postgres, Redis, MinIO, Qdrant, mail or the browser. The
# only way out is the model provider on the host (Strata's published port or
# Ollama), which the run must use to be a live measurement at all.
#
#   docker compose -p aiw-eval -f infra/eval-world/docker-compose.yml up -d
#   docker compose -p aiw-eval -f infra/eval-world/docker-compose.yml exec eval-backend \
#       python -m app.ai.evals.live_runner --corpus app/ai/evals/data/employee_live_v1.yaml
#   docker compose -p aiw-eval -f infra/eval-world/docker-compose.yml down -v
name: aiw-eval

x-eval-env: &eval-env
  EMPLOYEE_EVAL_WORLD: isolated
  POSTGRES_HOST: eval-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: aiw_eval
  POSTGRES_PASSWORD: aiw-eval-only
  POSTGRES_DB: aiworkspace_eval
  REDIS_URL: redis://eval-redis:6379/0
  # The world's own file and vector stores (tmpfs): file and search cases
  # run against them, never against the production ones.
  MINIO_ENDPOINT: eval-minio:9000
  MINIO_ACCESS_KEY: aiw-eval
  MINIO_SECRET_KEY: aiw-eval-only-secret
  MINIO_BUCKET: documents
  QDRANT_URL: http://eval-qdrant:6333
  QDRANT_API_KEY: ""
  # The world's own browser; it reaches only the world's test sites.
  WEB_BROWSER_URL: http://eval-browser:8093
  EGRESS_PROXY_URL: http://eval-browser:8094
  WEB_SEARCH_ENDPOINT: http://eval-unavailable:8080/search
  OLLAMA_URL: http://host-gateway:11434
  STRATA_URL: ${EVAL_STRATA_URL:-http://host-gateway:8090}
  STRATA_API_KEY: ${STRATA_API_KEY:-}
  APP_ENV: development
  # Real authentication: agent calls act as the owner through the signed
  # execution context, so roles and row security apply as in production.
  AUTH_ENABLED: "true"
  APP_SECRET_KEY: aiw-eval-secret-not-for-production
  CSRF_SECRET: aiw-eval-csrf-not-for-production
  AGENT_SERVICE_KEY: aiw-eval-agent-key
  FASTAPI_URL: http://eval-backend:8000
  AIAGENT_ROOT: /aiagent
  SCRIPT_RUNS_ENABLED: "false"
  EMG_PIPELINE_ENABLED: "false"

services:
  eval-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiw_eval
      POSTGRES_PASSWORD: aiw-eval-only
      POSTGRES_DB: aiworkspace_eval
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiw_eval -d aiworkspace_eval"]
      interval: 3s
      retries: 20
    networks: [eval]

  eval-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [eval]

  eval-backend:
    image: infra-backend:latest
    environment:
      <<: *eval-env
    volumes:
      # Skill registry, routes and prompts are data the agent reads.
      - ../../aiagent:/aiagent:ro
    extra_hosts:
      - "host-gateway:host-gateway"
    depends_on:
      eval-postgres:
        condition: service_healthy
      eval-redis:
        condition: service_started
      eval-minio:
        condition: service_started
      eval-qdrant:
        condition: service_started
    networks: [eval]

  eval-minio:
    image: minio/minio:latest
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: aiw-eval
      MINIO_ROOT_PASSWORD: aiw-eval-only-secret
    tmpfs:
      - /data
    networks: [eval]

  eval-qdrant:
    image: qdrant/qdrant:latest
    tmpfs:
      - /qdrant/storage
    networks: [eval]

  # Embeddings and reranking on the CPU, as the stack does while Strata holds
  # the GPU. The model files are the host's, mounted read-only.
  eval-ollama-cpu:
    image: ollama/ollama:latest
    environment:
      CUDA_VISIBLE_DEVICES: ""
      OLLAMA_MODELS: /models
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NOPRUNE: "1"
    volumes:
      - ${OLLAMA_MODELS_DIR:-/home/ollama-models/gpu/models}:/models:ro
    # Strata keeps ~39 GB of experts in RAM: a hard cap makes a squeeze kill
    # this container, not the stack.
    mem_limit: 10g
    networks: [eval]

  # Document processing (ingest, extraction) in the world, as in the stack.
  eval-worker:
    image: infra-celery-worker:latest
    command: celery -A app.tasks.celery_app worker -l info -c 2 -Q celery,extraction,ingest,scheduler,catalog,catalog_render
    environment:
      <<: *eval-env
      SKIP_DB_MIGRATE: "1"
    volumes:
      - ../../aiagent:/aiagent:ro
    extra_hosts:
      - "host-gateway:host-gateway"
    depends_on:
      eval-backend:
        condition: service_started
    networks: [eval]

  # The browser: the stack's image and egress policy, with one explicit
  # exception — the world's own subnet, where the test sites live.
  eval-browser:
    image: infra-web-browser:latest
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    shm_size: 1g
    environment:
      BROWSER_EGRESS_PROXY_HOST: 0.0.0.0
      BROWSER_EGRESS_PROXY_PORT: "8094"
      BROWSER_EGRESS_ALLOW_CIDRS: 172.31.250.0/24
    networks: [eval]

  # Static test sites (infra/eval-world/sites): supplier pages with contacts,
  # prices, links, a page without the asked fact and one carrying an
  # injected instruction.
  eval-sites:
    image: nginx:alpine
    volumes:
      - ./sites:/usr/share/nginx/html:ro
    networks:
      eval:
        # The same sites under a host no case grants: a grant limits hosts.
        aliases: [eval-other]

networks:
  eval:
    name: aiw-eval
    ipam:
      config:
        - subnet: 172.31.250.0/24
