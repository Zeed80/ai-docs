# Единая декларативная таблица маршрутизации запросов агента.
#
# Ключевые слова путей без модели. Потребители:
#   - fast-path (детерминированные count-вопросы и статус потока без LLM),
#   - выбор, нужен ли поиск по документам (retrieval_content_markers и соседи),
#   - action chips после завершения хода,
#   - пороги и словари хода (бюджеты ответа, field_terms и т. п.).
# Сам ход не маршрутизируется: всё, что не взял быстрый путь, делает один
# сотрудник с одним промптом.
# Не добавляйте ключевые слова в код — только сюда.
#
# Все ключевые слова сравниваются с нормализованным текстом: lower(), ё→е.

version: 1

# ── Маркеры типа запроса (быстрые пути и поиск по документам) ─────────────────────────

# Запрос требует rich-вывод на Рабочий стол (таблица/файл/график/документ).
workspace_request_markers:
  - "таблиц"
  - "полный список"
  - "все списком"
  - "выведи список"
  - "покажи список"
  - "список всех"
  - "список счет"
  - "выведи все"
  - "покажи все"
  - "найди все"
  - "со всех счет"
  - "по всем счет"
  - "список поставщик"
  - "список товар"
  - "ссылк"
  - "документ"
  - "чертеж"
  - "график"
  - "диаграм"
  - "excel"
  - "csv"
  - "скача"
  - "файл"
  - "сравн"
  - "отчет"
  - "столбец"
  - "столбц"
  - "колонк"
  - "добавь поле"
  - "убери поле"
  - "отсортируй"
  - "популярн"
  - "чаще всего"
  - "больше всего"
  - "топ товар"
  - "топ поставщик"
  - "расскажи о товар"
  - "какие товар"
  - "по товарам"
  - "номенклатур"
  - "сгруппируй"
  - "группировк"
  - "по месяц"
  - "по валют"
  - "по статус"

# Запрос требует RAG-retrieval из чанков документов / долговременной памяти.
# Если ни один маркер не найден И запрос — workspace/flow (отвечается из SQL),
# дорогой memory.search (vector + reranker) пропускается. Маркеры контента
# ВСЕГДА включают retrieval, даже для workspace-образных формулировок.
retrieval_content_markers:
  - "о чем"
  - "о чём"
  - "что написано"
  - "что в документ"
  - "что в письме"
  - "содержани"
  - "напомни"
  - "почему"
  - "что было"
  - "что говорил"
  - "найди похож"
  - "похожий"
  - "похожие"
  - "упомина"
  - "контекст"
  - "расскажи про"
  - "расскажи о письме"
  - "ранее"
  - "обсуждали"
  - "что мы решили"
  - "из переписки"
  - "по смыслу"
  - "семантическ"
  - "суть"

# Реляционные слова — вопрос про СВЯЗИ между сущностями, а не про список/таблицу.
# Вместе с entity_domain_markers переопределяет workspace-skip в
# needs_document_retrieval(): "покажи список счетов" — это таблица (skip),
# но "что связано с этим поставщиком" — это граф (retrieval), даже если
# само по себе выглядит как workspace-форма (упоминает сущность).
relational_markers:
  - "связ"
  - "истор"
  - "похож"
  - "цепочк"
  - "путь между"
  - "что привело"
  - "из-за чего"

# Сущностные маркеры — запрос касается домена графа бизнес-сущностей
# (поставщик/счёт/аномалия/согласование), а не произвольного текста.
entity_domain_markers:
  - "поставщик"
  - "счет"
  - "аномали"
  - "согласован"
  - "одобрен"

# Сквозные вопросы о состоянии документооборота (секретарь / flow-status).
flow_status_markers:
  - "что требует внимания"
  - "требует внимания"
  - "что у нас по документ"
  - "статус потока"
  - "статус документооборот"
  - "что висит"
  - "что застряло"
  - "что зависло"
  - "дай сводку"
  - "сводку по документ"
  - "общая сводка"
  - "что просрочено"
  - "что на проверке"
  - "что на согласовании"
  - "что нужно сделать"
  - "что в работе"
  - "состояние документооборот"
  - "что по делам"
  - "обзор дня"
  - "что нового по документ"

# ── Fast-path: детерминированные count-вопросы (0 LLM) ────────────────────────

fast_paths:
  # Обязательный маркер count-вопроса.
  count_markers: ["сколько", "кол-во", "количество", "число ", "всего "]
  # Условие отбора, которого fast-path не выражает: «у скольких не указан
  # телефон» ответили «Всего поставщиков: 35» (живой ход 2026-10-13). Второй
  # вопрос о количестве в той же фразе тоже уводит в LLM-поток.
  condition_markers: ["у скольких", "у которых", "которые", "без ", "не указан", "нет ", "кроме", "только "]
  # При этих маркерах fast-path НЕ срабатывает (нужен rich-вывод → LLM-поток).
  rich_output_markers:
    - "таблиц"
    - "список"
    - "перечисл"
    - "выведи"
    - "покажи все"
    - "построй"
    - "график"
    - "диаграм"
    - "excel"
    - "экспорт"
    - "выгруз"
    - "по поставщик"
    - "по месяц"
    - "сгруппир"
    - "детал"
    - "построчн"
  # Служебные слова, которые не меняют ответа на «сколько <сущность>». Любое
  # другое слово (имя поставщика, период, сумма) — условие отбора: тогда
  # подсчёт делает модель, а не быстрый путь («сколько счетов Хоффман?»
  # ответили «Всего счетов: 153», живой ход 2026-10-13).
  count_filler_words: [привет, здравствуй, добрый, день, пожалуйста, подскажи,
    скажи, нас, всего, есть, имеется, сейчас, системе, системы, базе, базы,
    справочнике, справочника, приложении, сервисе, вообще, итого, общее,
    количество, число, штук, точно, всех, загружено, загружены, загрузили,
    заведено, заведены, хранится, хранятся, лежит, имеем, how, many, the,
    are, there]
  # Складской контекст для инвентарного подсчёта.
  stock_markers: ["склад", "остатк", "на складе", "в наличии", "запас"]
  # Вопросы о цене/сумме — это не count-вопросы.
  price_markers:
    - "сколько стоит"
    - "сколько сто"
    - "стоит"
    - "сколько денег"
    - "сколько рубл"
    - "на какую сумму"
    - "на сумму"
    - "сумма счет"
    - "сумму счет"
  # Подсчёт счетов с фильтром по статусу — проверяется ПЕРЕД entity_counts.
  # Срабатывает если в тексте есть И entity-маркер, И status-маркер.
  # Первое совпавшее правило выигрывает: needs_review идёт раньше approved,
  # т.к. "на согласовании"/"на утверждении" содержат корни, пересекающиеся
  # с "согласован"/"утверждён" — порядок различает «ждёт» от «завершено».
  status_counts:
    - entity: "счет"
      markers: ["ожида", "на утверждени", "на согласовани", "на рассмотрени", "на проверк", "не утвержд", "не рассмотр", "ждут утвержд", "ждущ утвержд", "needs_review"]
      capability: invoices
      status: needs_review
      label: "счетов на проверке (ждут утверждения)"
    - entity: "счет"
      markers: ["утвержден", "утверждён", "одобрен", "approved"]
      capability: invoices
      status: approved
      label: "утверждённых счетов"
    - entity: "счет"
      markers: ["отклонен", "отклонён", "отказан", "rejected"]
      capability: invoices
      status: rejected
      label: "отклонённых счетов"
    - entity: "счет"
      markers: ["оплачен", "оплаченн", "paid"]
      capability: invoices
      status: paid
      label: "оплаченных счетов"
    - entity: "счет"
      markers: ["черновик", "черновы", "draft"]
      capability: invoices
      status: draft
      label: "черновиков счетов"
  # Подсчёт сущностей верхнего уровня: keyword → capability + подпись.
  entity_counts:
    - { keyword: "счет",       capability: invoices,  label: "счетов" }
    - { keyword: "инвойс",     capability: invoices,  label: "счетов" }
    - { keyword: "поставщик",  capability: suppliers, label: "поставщиков" }
    - { keyword: "контрагент", capability: suppliers, label: "поставщиков" }
    - { keyword: "аномали",    capability: anomalies, label: "аномалий" }
    - { keyword: "документ",   capability: documents, label: "документов" }

# ── Группировка по поставщикам ────────────────────────────────────────────────

# ── Маршруты интентов ─────────────────────────────────────────────────────────
# Первое совпадение по keywords выигрывает (порядок имеет значение).

# ── Fallback-правила выбора canvas (когда маршрут не дал canvas_id) ──────────

# ── Сопоставление canvas ↔ workspace-skill (для аудита и прямого ремонта) ────

skill_to_spec:
  "workspace.spec_table_patch":
    path: "/api/workspace/agent/spec-table/patch"
    default_args: {}

# Per-turn response token budget (orchestrator._response_budget_for).
# by_output_type проверяется первым (report/table/document/chart нужен простор
# независимо от tier), затем by_tier по убыванию, затем default.
response_budgets:
  by_output_type:
    table: 8192
    document: 8192
    chart: 8192
  by_tier:
    large: 8192
    medium: 4096
    micro: 1024
  default: 2048

# Max auxiliary quality LLM calls per turn (model_tier.aux_quality_budget) —
# planner/executor calls are structural (already tier-gated) and NOT counted
# here; this bounds the extra checking layers (semantic audit, self-refine),
# which dominate latency on local models.
aux_quality_budgets:
  large: 2
  default: 1

# ── Action chips (контекстные кнопки после завершения хода) ───────────────────

chips:
  - intents: [invoice_list, invoice_detail]
    keywords: ["счет"]
    items:
      - { label: "Открыть счета", action: navigate, target: "/invoices" }
      - { label: "Экспорт в Excel", action: cap, cap: invoices, act: export_excel }
  - intents: [supplier_profile, supplier_search]
    keywords: ["поставщик"]
    items:
      - { label: "Профиль поставщика", action: navigate, target: "/suppliers" }
  - intents: [anomaly_check]
    keywords: ["аномали"]
    items:
      - { label: "Открыть аномалии", action: navigate, target: "/anomalies" }
  - intents: [draft_email, email_triage]
    keywords: ["письм"]
    items:
      - { label: "Черновики", action: navigate, target: "/drafts" }
  - intents: [compare]
    keywords: ["сравни"]
    items:
      - { label: "Сравнение КП", action: navigate, target: "/compare" }
  - intents: [image_studio]
    keywords: ["нарисуй", "сгенерируй", "перерисуй", "эскиз", "чертеж"]
    items:
      - { label: "Открыть в студии", action: navigate, target: "/studio" }
  - intents: [calendar]
    keywords: ["напомни", "срок"]
    items:
      - { label: "Календарь", action: navigate, target: "/calendar" }
  - intents: [flow_status]
    keywords: []
    items:
      - { label: "Согласования", action: navigate, target: "/approvals" }
      - { label: "Открыть аномалии", action: navigate, target: "/anomalies" }

# ── Доменные секции системного промпта оркестратора ───────────────────────────
# Рендерятся в _ORCHESTRATOR_SYSTEM; ключевые слова здесь — подсказка модели,
# машинная маршрутизация использует routes/markers выше.

# T7b (E52): a request for a whole set ("все утверждённые счета", "для всех
# кругов") makes several records matching one lookup the user's set, not a
# model's choice among look-alikes. Normalized (lower, ё→е) whole words.
group_request_words: [все, всех, всем, всеми, каждый, каждого, каждому, каждой, каждую]

# T8b (E52): a page that says it is out of date is not a source for a card.
# Normalized (lower, ё→е) substrings of the page text.
stale_source_markers: [устарел, архивная страниц, не обновляется, не обслуживается, больше не действует, недействител]

# T8i (owner 2026-10-18): stems by which a request names its own date. A
# reminder about a record no lookup found, in a request without such a word
# or a number ("в день срока"), can only take its date from the record —
# it waits for the owner. Normalized (lower, ё→е) word prefixes.
request_date_words: [понедельник, вторник, среду, среда, четверг, пятниц, суббот, воскресень, завтра, послезавтра, сегодня, через, январ, феврал, март, апрел, мая, июн, июл, август, сентябр, октябр, ноябр, декабр, утр, вечер, недел, месяц]

# T7c (E52): a field of an existing record changes only when the request names
# it. tool → field → word stems (normalized: lower, ё→е). A field changed
# without any of its stems in the request waits for the owner. Fields not
# listed here are not judged.
field_terms:
  suppliers.update:
    name: [назван, наименован, переимен]
    inn: [инн]
    kpp: [кпп]
    ogrn: [огрн]
    address: [адрес]
    contact_email: [e-mail, email, почт, мейл, электрон]
    contact_phone: [телефон, номер]
    bank_name: [банк]
    bank_bik: [бик]
    bank_account: [расчетн, р/с, реквизит]
    corr_account: [корр, к/с, реквизит]
    user_rating: [рейтинг, оцен]
    price_spike_threshold_pct: [порог]
