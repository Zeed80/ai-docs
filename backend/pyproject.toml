[project]
name = "ai-workspace-backend"
version = "0.1.0"
description = "AI Manufacturing Workspace — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "minio>=7.2",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "pymupdf>=1.25",
    "openpyxl>=3.1",
    # Legacy binary .xls price lists — openpyxl cannot read them at all.
    "xlrd>=2.0",
    # Suppliers routinely ship several price lists in one archive.
    "py7zr>=0.21",
    "rarfile>=4.2",
    "qdrant-client>=1.13",
    "structlog>=24.4",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "psycopg2-binary>=2.9",
    "lxml>=5.0",
    "nh3>=0.2.18",  # HTML sanitiser for inbound email bodies (email client v2)
    # IMAP IDLE (Ф2.3). imaplib gained .idle() only in Python 3.15 and this
    # image runs 3.11; the alternative was driving IDLE through imaplib's
    # private _command/_get_response, which breaks silently on a Python bump.
    "imapclient>=3.0",
    "anthropic>=0.39.0,<1",
    "python-telegram-bot>=22.6,<23",
    "ezdxf>=1.3",
    "svgwrite>=1.4",
    "cairosvg>=2.7",
    "pdfplumber>=0.11",
    "Pillow>=11.0",
    "filetype>=1.2",
    "sentry-sdk[fastapi]>=2.0,<3",
    "prometheus-client>=0.21,<1",
    "docker>=7.1,<8",
    "networkx>=3.4,<4",
    "opencv-contrib-python-headless>=4.10,<5",
    "pytesseract>=0.3.13,<1",
    "shapely>=2.0,<3",
    "scipy>=1.15,<2",
    # Parse and validate construction/BIM ground truth instead of treating IFC as text.
    "ifcopenshell==0.8.5",
    # ezdxf's matplotlib drawing backend (LoRA dataset DXF/DWG target renders)
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # Tests already carry @pytest.mark.timeout(...) markers, but without this
    # plugin pytest only warns "Unknown pytest.mark.timeout" and the markers do
    # nothing — one hung async test then holds the whole suite open forever
    # (observed 2026-08-27: the run sat in epoll for 8 minutes before it was
    # killed by hand). Use --timeout-method=signal: the "thread" method kills
    # the entire pytest process instead of failing just the offending test.
    "pytest-timeout>=2.3",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.16,<0.17",
    "mypy>=1.13",
    # Конфиг .pre-commit-config.yaml лежал в репозитории с самого начала, но
    # сам pre-commit нигде не был объявлен зависимостью — поэтому хука в
    # .git/hooks не появлялось ни у кого, и ruff гонялся только вручную.
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# Отключено осознанно, чтобы хук был проходимым: неисполнимые ворота
# блокируют каждый коммит и через день их снимают целиком.
ignore = [
    # Длину строки держит ruff-format. Остаются те 800 строк, которые он
    # перенести не может — URL, длинные строковые литералы, комментарии.
    "E501",
    # Импорт не в начале модуля здесь почти всегда намеренный: ленивый
    # импорт внутри функции разрывает цикл (app.ai ↔ app.api) или
    # откладывает тяжёлую загрузку (torch, FreeCAD).
    "E402",
    # Имена по правилам PEP 8 конфликтуют с чужими API: FreeCAD и OCC
    # отдают CamelCase, у SQLAlchemy и Pydantic свои соглашения.
    "N802", "N803", "N806", "N814", "N817", "N818",
    # StrEnum вместо (str, Enum) — переход, ломающий сериализацию значений
    # в существующих записях БД. Отдельная задача, не автоправка.
    "UP042",
    # `Column == False` в фильтрах SQLAlchemy обязателен: `not Column` вычислит
    # питоновскую истинность объекта колонки, а не SQL-условие.
    "E712",
]

[tool.ruff.lint.per-file-ignores]
# Плотная математика невязок: каждое ограничение — строка вида
# `if not a or not b: raise ValueError`. Разворачивать её построчно значит
# втрое удлинить функцию и потерять читаемость таблицы ограничений.
"**/cad_ir/constraints.py" = ["E701"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_loop_scope = "session"
testpaths = ["tests"]
# Потолок на тест. pytest-timeout поставили именно из-за зависаний (см.
# комментарий к зависимости выше), но глобального лимита так и не задали —
# только маркеры на отдельных тестах. Из-за этого один тест, ушедший в
# неотвечающую Ollama, держал весь набор: 707 пройденных, дальше 30 минут
# тишины на 41% и ручное прерывание, вместо честного падения с именем теста.
# 900 с: потолок против зависания, а не мерило скорости. CAD-тесты считают
# растр в OpenCV и на загруженной машине выходили за 300 с — исправные тесты
# не должны падать оттого, что рядом работает Ollama.
timeout = 900
# signal, а не thread: thread-метод убивает процесс pytest целиком вместо
# того, чтобы завалить один виновный тест.
timeout_method = "signal"
markers = [
    "live: requires running Ollama at host-gateway:11434",
    "llamacpp: requires llama.cpp at llama-server:8080",
    "vllm: requires vLLM at vllm-server:8000",
    "slow: takes >10s per test",
    "recipes: opts a test in to real recipe retrieval (no autouse stub)",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
