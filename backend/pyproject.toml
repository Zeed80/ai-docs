[project]
name = "ai-workspace-backend"
version = "0.1.0"
description = "AI Manufacturing Workspace — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "minio>=7.2",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "pymupdf>=1.25",
    "openpyxl>=3.1",
    # Legacy binary .xls price lists — openpyxl cannot read them at all.
    "xlrd>=2.0",
    # Suppliers routinely ship several price lists in one archive.
    "py7zr>=0.21",
    "rarfile>=4.2",
    "qdrant-client>=1.13",
    "structlog>=24.4",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "psycopg2-binary>=2.9",
    "lxml>=5.0",
    "nh3>=0.2.18",  # HTML sanitiser for inbound email bodies (email client v2)
    "anthropic>=0.39.0,<1",
    "python-telegram-bot>=22.6,<23",
    "ezdxf>=1.3",
    "svgwrite>=1.4",
    "cairosvg>=2.7",
    "pdfplumber>=0.11",
    "Pillow>=11.0",
    "filetype>=1.2",
    "sentry-sdk[fastapi]>=2.0,<3",
    "prometheus-client>=0.21,<1",
    "docker>=7.1,<8",
    "networkx>=3.4,<4",
    "opencv-contrib-python-headless>=4.10,<5",
    "pytesseract>=0.3.13,<1",
    "shapely>=2.0,<3",
    "scipy>=1.15,<2",
    # Parse and validate construction/BIM ground truth instead of treating IFC as text.
    "ifcopenshell==0.8.5",
    # ezdxf's matplotlib drawing backend (LoRA dataset DXF/DWG target renders)
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # Tests already carry @pytest.mark.timeout(...) markers, but without this
    # plugin pytest only warns "Unknown pytest.mark.timeout" and the markers do
    # nothing — one hung async test then holds the whole suite open forever
    # (observed 2026-08-27: the run sat in epoll for 8 minutes before it was
    # killed by hand). Use --timeout-method=signal: the "thread" method kills
    # the entire pytest process instead of failing just the offending test.
    "pytest-timeout>=2.3",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "live: requires running Ollama at host-gateway:11434",
    "llamacpp: requires llama.cpp at llama-server:8080",
    "vllm: requires vLLM at vllm-server:8000",
    "slow: takes >10s per test",
    "recipes: opts a test in to real recipe retrieval (no autouse stub)",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
